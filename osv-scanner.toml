[[IgnoredVulns]]
id = "GHSA-h67p-54hq-rp68"
reason = "js-yaml@3.14.2 is a transitive dependency via gray-matter@4.0.3 (latest), which requires js-yaml ^3.13.1 and has no js-yaml 4.x support. The vulnerable load() function is never reached: gray-matter uses safeLoad() for YAML parsing and rdme explicitly disables the javascript engine in grayMatter() options."

[[IgnoredVulns]]
id = "GHSA-35p6-xmwp-9g52"
reason = "undici@6.26.0 is bundled inside npm@11.17.0 (the latest available npm) via @oclif/plugin-plugins > npm bundleDependencies. Cannot be upgraded without overrides/resolutions. rdme uses its own top-level undici@6.27.0 for all outbound HTTP calls; npm's bundled undici is only used internally when npm installs plugins at runtime."

